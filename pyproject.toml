[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdcut"
version = "0.2.0"
description = "AI-assisted editor for KDPlays Minecraft videos: raw OBS sessions in, DaVinci Resolve timeline out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Local GPU transcription. On Windows + NVIDIA also install the CUDA runtime wheels.
whisper = ["faster-whisper>=1.1"]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
all = ["faster-whisper>=1.1", "nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# The desktop app (what the Windows installer bundles).
app = ["faster-whisper>=1.1", "PySide6-Essentials>=6.6"]

[project.scripts]
kdcut = "kdcut.cli:main"

[project.gui-scripts]
kdcut-app = "kdcut.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdcut = ["assets_app/*"]
