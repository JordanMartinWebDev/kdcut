name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[app]" pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_raw
          New-Item -ItemType Directory -Force packaging/ffmpeg | Out-Null
          Get-ChildItem ffmpeg_raw -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination packaging/ffmpeg/
          packaging/ffmpeg/ffmpeg.exe -version | Select-Object -First 1

      - name: Run tests on Windows
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          $env:PATH = "$pwd\packaging\ffmpeg;$env:PATH"
          python -m unittest discover -s tests -v

      - name: Build app
        run: pyinstaller packaging/kdcut.spec --noconfirm

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\KDcut\KDcut.exe" -ArgumentList "--selftest","$pwd\selftest.json","--whisper" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=0.2.${{ github.run_number }} packaging\installer.iss
          Get-Item dist\KDcut-Setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: KDcut-Setup
          path: dist/KDcut-Setup.exe

      - name: Publish download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --cleanup-tag -y || true
          gh release create app-latest dist/KDcut-Setup.exe \
            --title "KDcut 0.2.${{ github.run_number }}" \
            --notes "Download **KDcut-Setup.exe** below and run it. Built from ${{ github.sha }}." \
            --target ${{ github.sha }} --latest
